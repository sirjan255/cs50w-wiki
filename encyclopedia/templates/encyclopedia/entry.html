{% extends "encyclopedia/layout.html" %}

{% block title %}
    {{ title }}
{% endblock %}

{% block body %}
    <h1>{{ title }}</h1>
    <div>
        {{ content|safe }}
    </div>
    <div style="margin-top: 2em;">
        <a href="{% url 'edit' title %}" class="btn">Edit Page</a>
    </div>
{% endblock %}
