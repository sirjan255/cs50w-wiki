<!DOCTYPE html>
<html lang="en">
    <head>
        <title>{% block title %}Encyclopedia{% endblock %}</title>
        <meta charset="utf-8">
        <link href="https://fonts.googleapis.com/css?family=Roboto:400,700" rel="stylesheet">
        <style>
            body {
                font-family: 'Roboto', Arial, sans-serif;
                margin: 0;
                background: #f9f9f9;
            }
            #container {
                display: flex;
                min-height: 100vh;
            }
            #sidebar {
                background: #222e50;
                color: #fff;
                width: 260px;
                padding: 40px 20px 20px 20px;
                box-sizing: border-box;
                min-height: 100vh;
            }
            #sidebar h2 {
                margin-top: 0;
                color: #aac6ef;
                font-size: 1.7em;
                letter-spacing: 1px;
                margin-bottom: 2em;
            }
            #sidebar form {
                margin-bottom: 2em;
            }
            #sidebar input[type="text"] {
                width: calc(100% - 12px);
                padding: 7px 5px;
                font-size: 1em;
                border-radius: 3px;
                border: none;
                margin-bottom: 10px;
            }
            #sidebar input[type="submit"] {
                background: #aac6ef;
                color: #222e50;
                border: none;
                border-radius: 3px;
                padding: 7px 16px;
                cursor: pointer;
                font-weight: bold;
                margin-top: 5px;
            }
            #sidebar a {
                display: block;
                color: #aac6ef;
                text-decoration: none;
                margin: 12px 0;
                font-size: 1.08em;
                transition: color 0.2s;
            }
            #sidebar a:hover {
                color: #fff;
            }
            #main {
                flex: 1;
                background: #fff;
                padding: 40px 60px;
                box-sizing: border-box;
                min-height: 100vh;
            }
            h1, h2, h3, h4, h5 {
                color: #222e50;
            }
            ul {
                padding-left: 1.3em;
            }
            code, pre {
                background: #f3f6fa;
                border-radius: 3px;
                padding: 2px 4px;
            }
        </style>
        {% block extrahead %}{% endblock %}
    </head>
    <body>
        <div id="container">
            <div id="sidebar">
                <h2>Wiki</h2>
                <form action="{% url 'search' %}" method="get">
                    <input type="text" name="q" placeholder="Search Encyclopedia">
                    <input type="submit" value="Search">
                </form>
                <a href="{% url 'index' %}">Home</a>
                <a href="{% url 'new' %}">Create New Page</a>
                <a href="{% url 'random_page' %}">Random Page</a>
            </div>
            <div id="main">
                {% block body %}
                {% endblock %}
            </div>
        </div>
    </body>
</html>
